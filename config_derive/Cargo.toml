[package]
name = "vivido_config_derive"
version = "0.4.0"
authors = ["Wensheng Wang <wenshengwang@gmail.com>"]
license = "Apache-2.0 OR MIT"
description = "Configuration derives for Vivido"
homepage = "https://vivido.dev"
repository = "https://github.com/vivido-dev/vivido"
edition = "2024"
rust-version = "1.88.0"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.24"
quote = "1.0.7"
syn = { version = "3.0", default-features = false, features = [
  "derive",
  "parsing",
  "proc-macro",
  "printing",
] }
