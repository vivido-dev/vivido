[package]
name = "vivido"
version = "0.4.3"
authors = ["Wensheng Wang <wenshengwang@gmail.com>"]
license = "Apache-2.0"
description = "A fast cross-platform terminal emulator with protocol-neutral media hooks"
readme = "README.md"
homepage = "https://vivido.dev"
repository = "https://github.com/vivido-dev/vivido"
edition = "2024"
rust-version = "1.88.0"
exclude = ["src/terminal/ref_tests.rs", "tests/ref"]

[lib]
name = "vivido"
path = "src/lib.rs"

[[bin]]
name = "vivido"
path = "src/main.rs"

[[bin]]
name = "vvssh"
path = "src/bin/vvssh.rs"

[dependencies]
ahash = { version = "0.8.6", features = ["no-rng"] }
arboard = { version = "3.6", default-features = false, features = ["image-data"] }
async-channel = "2.5.0"
base64 = "0.23.0"
bitflags = { version = "2.4.1", features = ["serde"] }
bytemuck = { version = "1.24", features = ["derive"] }
clap = { version = "4.2.7", features = ["derive", "env"] }
copypasta = { version = "0.10.1", default-features = false }
futures-lite = "2.6.1"
futures-timer = "3.0.4"
getrandom = "0.4"
home = "0.5.5"
image = { version = "0.25", default-features = false, features = [
  "png",
  "jpeg",
] }
libc = "0.2"
log = { version = "0.4", features = ["std", "serde"] }
memchr = "2.7"
percent-encoding = "2.3"
notify = "8.0.0"
notify-rust = { version = "4.18.0", features = ["preview-macos-un"] }
parking_lot = "0.12.0"
parley = "0.11"
polling = "3.11.0"
pollster = "1.0"
regex-automata = "0.4.3"
rpassword = "7.4.0"
serde_json = "1"
serde = { version = "1", features = ["derive", "rc"] }
sha2 = "0.11"
signal-hook = { version = "0.4.3", default-features = false }
tempfile = "3.12.0"
toml = "1.1"
toml_edit = "0.25"
unicode-width = "0.2.0"
unicode-script = "0.5"
vivid_protocol = { version = "1.5", path = "../vivid_protocol" }
vte = { version = "0.15.0", default-features = false, features = [
  "std",
  "ansi",
  "serde",
] }
zeroize = "1.8.1"
vello = { version = "0.10", default-features = false, features = ["wgpu"] }
winit = { version = "0.30.9", default-features = false, features = [
  "rwh_06",
  "serde",
] }

[build-dependencies]
pkg-config = "0.3"

[dev-dependencies]
accesskit = "0.24.1"
accesskit_winit = { version = "0.33.2", default-features = false, features = [
  "rwh_06",
] }
clap_complete = "4.2.3"
vivid_sdk = { version = "1.5", path = "../vivid_sdk" }

[target.'cfg(not(windows))'.dependencies]
xdg = "3.0.0"

[target.'cfg(any(target_os = "macos", target_os = "linux", windows))'.dependencies]
cpal = "0.18"
ringbuf = "0.5"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.0.0", default-features = false, features = ["std"] }
rustix-openpty = "0.2.0"

[target.'cfg(target_os = "macos")'.dependencies]
mac-usernotifications = { version = "0.3.1", default-features = false }
objc2 = "0.6.1"
objc2-application-services = { version = "0.3.2", default-features = false, features = [
  "std",
  "AXError",
  "AXUIElement",
  "AXValue",
  "HIServices",
  "libc",
] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
  "std",
  "CFArray",
  "CFNumber",
  "CFString",
] }
objc2-foundation = { version = "0.3.1", default-features = false, features = [
  "NSArray",
  "NSAttributedString",
  "std",
  "NSString",
  "NSLocale",
  "NSValue",
  "NSUserDefaults",
] }
objc2-app-kit = { version = "0.3.1", default-features = false, features = [
  "objc2-core-foundation",
  "NSAccessibility",
  "NSAccessibilityConstants",
  "NSAccessibilityElement",
  "NSAccessibilityProtocols",
  "NSApplication",
  "std",
  "NSColorSpace",
  "NSControl",
  "NSEvent",
  "NSLayoutAnchor",
  "NSLayoutConstraint",
  "NSMenu",
  "NSMenuItem",
  "NSResponder",
  "NSTextField",
  "NSView",
  "NSWindow",
  "NSWindowTab",
  "NSWorkspace",
] }
wgpu = { version = "29.0", default-features = false, features = [
  "metal",
  "std",
  "wgsl",
] }

[target.'cfg(windows)'.dependencies]
accesskit = "0.24.1"
accesskit_winit = { version = "0.33.2", default-features = false, features = [
  "rwh_06",
] }
dirs = "6.0.0"
miow = "0.6.0"
piper = "0.2.1"
windows-sys = { version = "0.61.2", features = [
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_Threading",
  "Win32_System_Console",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_LibraryLoader",
  "Win32_System_Pipes",
  "Win32_System_WindowsProgramming",
] }
windows = { version = "0.62.2", default-features = false, features = [
  "Win32_Foundation",
  "Win32_Graphics_DirectComposition",
] }
wgpu = { version = "29.0", default-features = false, features = [
  "dx12",
  "std",
  "wgsl",
] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
accesskit = "0.24.1"
accesskit_winit = { version = "0.33.2", default-features = false, features = [
  "accesskit_unix",
  "async-io",
  "rwh_06",
] }
wgpu = { version = "29.0", default-features = false, features = [
  "std",
  "vulkan",
  "wgsl",
] }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0.2"

[features]
default = ["serde", "wayland", "x11"]
serde = []
# Winit picks its backend at runtime: Wayland when WAYLAND_DISPLAY is set, X11 otherwise.
x11 = ["winit/x11"]
wayland = [
  "arboard/wayland-data-control",
  "copypasta/wayland",
  "winit/wayland",
  "winit/wayland-dlopen",
  "winit/wayland-csd-adwaita",
]
nightly = []

[workspace]
resolver = "2"

[profile.release]
lto = "thin"
debug = 1
incremental = false
#codegen-units = 1 # Reduces parallelism during the final compilation phase for better optimization

[profile.dev]
debug = "line-tables-only"
